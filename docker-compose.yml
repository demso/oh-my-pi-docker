name: omp-containers

services:
  omp-container:
    image: localhost/aerovato/container-v3:latest
    build:
      context: .
      dockerfile: Dockerfile.User
    container_name: omp-container
    tty: true          
    stdin_open: true  
    volumes:
      - omp_data:/root
      - D:/files/repos:/repos
      - C:/Users/koposov/Documents/ShareX/Screenshots:/screenshots
      - ${DOWNLOADS}:/downloads
 
volumes:
  omp_data:
